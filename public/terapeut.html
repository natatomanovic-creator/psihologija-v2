<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Terapeut</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #F5F0E8;
  --warm-white: #FAFAF7;
  --ink: #1A1814;
  --ink-light: #4A4640;
  --ink-muted: #8A8680;
  --accent: #8B4B3C;
  --accent-light: #C4806E;
  --accent-bg: #F5EBE8;
  --teal: #2D6B5E;
  --teal-bg: #E8F2F0;
  --gold: #B8922A;
  --gold-bg: #FBF3E0;
  --border: rgba(26,24,20,0.12);
  --shadow: 0 2px 20px rgba(26,24,20,0.08);
  --career-bg: #1a1a2e;
}

body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }

/* ── HEADER ── */
.site-header {
  background: var(--ink);
  color: var(--cream);
  padding: 1.25rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.site-header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.3rem;
  font-weight: 400;
}

.site-header span {
  font-size: 0.78rem;
  color: rgba(245,240,232,0.5);
}

/* ── LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: calc(100vh - 60px);
}

@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
}

/* ── SIDEBAR ── */
.sidebar {
  border-right: 1px solid var(--border);
  background: var(--warm-white);
  padding: 1.5rem 0;
  overflow-y: auto;
}

.sidebar-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0 1.25rem;
  margin-bottom: 0.75rem;
}

.client-item {
  padding: 0.85rem 1.25rem;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
}

.client-item:hover { background: var(--cream); }
.client-item.active { border-left-color: var(--accent); background: var(--accent-bg); }

.ci-name {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 3px;
}

.client-item.active .ci-name { color: var(--accent); }

.ci-meta {
  font-size: 0.75rem;
  color: var(--ink-muted);
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.ci-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.ci-badge.psih { background: var(--accent-bg); color: var(--accent); }
.ci-badge.kar { background: var(--gold-bg); color: var(--gold); }

.sidebar-empty {
  padding: 1.5rem 1.25rem;
  font-size: 0.85rem;
  color: var(--ink-muted);
}

/* ── MAIN ── */
.main {
  padding: 2rem;
  overflow-y: auto;
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--ink-muted);
}

.empty-state h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.5rem;
  font-weight: 400;
  color: var(--ink-light);
  margin-bottom: 0.5rem;
}

.empty-state p { font-size: 0.9rem; line-height: 1.6; }

/* ── CLIENT VIEW ── */
.client-header {
  margin-bottom: 2rem;
}

.client-header h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.8rem;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 0.25rem;
}

.client-header-meta {
  font-size: 0.82rem;
  color: var(--ink-muted);
}

/* ── ENTRY ── */
.entry {
  background: var(--warm-white);
  border: 0.5px solid var(--border);
  border-radius: 14px;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow);
}

.entry-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.entry-type {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.entry-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.entry-badge.psih { background: var(--accent-bg); color: var(--accent); }
.entry-badge.kar { background: var(--gold-bg); color: var(--gold); }

.entry-date {
  font-size: 0.78rem;
  color: var(--ink-muted);
}

.entry-priority {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
}
.priority-visok { background: #FBF0F0; color: #9A3030; }
.priority-srednji { background: var(--gold-bg); color: var(--gold); }
.priority-nizak { background: var(--teal-bg); color: var(--teal); }

/* ── SCORES ── */
.section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}

.dim-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.dim-label { font-size: 13px; color: var(--ink-light); width: 140px; flex-shrink: 0; }
.dim-track { flex: 1; height: 5px; background: var(--cream); border-radius: 3px; overflow: hidden; }
.dim-fill { height: 100%; border-radius: 3px; }
.dim-val { font-size: 13px; font-weight: 600; color: var(--ink); width: 30px; text-align: right; }

.score-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.6rem;
  margin-bottom: 1rem;
}

.score-box {
  background: var(--cream);
  border-radius: 10px;
  padding: 0.75rem;
}

.score-box-name { font-size: 11px; color: var(--ink-muted); margin-bottom: 4px; }
.score-box-val { font-size: 1.2rem; font-weight: 600; color: var(--ink); }
.score-box-level { font-size: 11px; font-weight: 500; margin-top: 2px; }
.level-high { color: var(--accent); }
.level-ok { color: var(--teal); }

/* ── TEXT SECTIONS ── */
.text-block {
  background: var(--cream);
  border-radius: 10px;
  padding: 1rem 1.25rem;
  margin-bottom: 0.75rem;
  font-size: 0.88rem;
  line-height: 1.75;
  color: var(--ink-light);
}

.red-flags-box {
  background: #FBF0F0;
  border-radius: 10px;
  padding: 0.9rem 1.1rem;
  margin-bottom: 0.75rem;
}

.red-flag-title {
  font-size: 11px;
  font-weight: 600;
  color: #9A3030;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.5rem;
}

.red-flag-item {
  font-size: 0.83rem;
  color: #7A2020;
  margin-bottom: 3px;
  padding-left: 1.1rem;
  position: relative;
}
.red-flag-item::before { content: "⚠"; position: absolute; left: 0; }

/* ── SWOT ── */
.swot-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}

@media (max-width: 500px) { .swot-grid { grid-template-columns: 1fr; } }

.swot-box {
  background: var(--cream);
  border-radius: 10px;
  padding: 0.75rem;
}

.swot-lbl {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}
.swot-lbl.s { color: var(--teal); }
.swot-lbl.w { color: var(--accent); }
.swot-lbl.o { color: #4A52A0; }
.swot-lbl.t { color: var(--gold); }

.swot-text { font-size: 0.83rem; color: var(--ink-light); line-height: 1.5; }

/* ── RIASEC ── */
.riasec-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.riasec-name { font-size: 12px; color: var(--ink-light); width: 130px; flex-shrink: 0; }
.riasec-track { flex: 1; height: 5px; background: var(--cream); border-radius: 3px; overflow: hidden; }
.riasec-fill { height: 100%; background: linear-gradient(90deg, var(--gold), #e8c97a); border-radius: 3px; }
.riasec-val { font-size: 12px; color: var(--ink-muted); width: 32px; text-align: right; }

/* ── LOADING ── */
.loading {
  text-align: center;
  padding: 3rem;
  color: var(--ink-muted);
  font-size: 0.9rem;
}

/* ── COLLAPSIBLE ── */
.collapse-btn {
  background: none;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  color: var(--ink-muted);
  cursor: pointer;
  padding: 0;
  margin-top: 0.75rem;
  text-decoration: underline;
}
.collapse-btn:hover { color: var(--ink); }

.collapsible { display: none; margin-top: 1rem; }
.collapsible.open { display: block; }

.divider { border: none; border-top: 0.5px solid var(--border); margin: 1.25rem 0; }

/* ── REFRESH ── */
.refresh-btn {
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 0.4rem 0.9rem;
  font-size: 0.78rem;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.15s;
  margin: 0 1.25rem 1rem;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<header class="site-header">
  <h1>Dashboard — Terapeut</h1>
  <span>Psihološki i karijerni profili</span>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-label">Klijenti</div>
    <button class="refresh-btn" onclick="loadClients()">↺ Osvježi</button>
    <div id="clientList"><div class="sidebar-empty">Učitavam...</div></div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainPanel">
    <div class="empty-state">
      <h2>Odaberite klijenta</h2>
      <p>Svi klijenti koji ispune test automatski se<br>pojavljuju u lijevom izborniku.</p>
    </div>
  </main>
</div>

<script>
const DIM_NAMES = { E:'Ekstraverzija', N:'Neuroticizam', O:'Otvorenost', A:'Ugodnost', C:'Savjesnost' };
const DIM_COLORS = { E:'#8B4B3C', N:'#C4806E', O:'#2D6B5E', A:'#D4537E', C:'#4A52A0' };
const ATTACH_NAMES = { secure:'Siguran', anxious:'Anksiozni', avoidant:'Izbjegavajući', fearful:'Plašljivi' };

let allClients = [];
let activeKey = null;

// ── LOAD CLIENTS ──────────────────────────────────────

async function loadClients() {
  document.getElementById('clientList').innerHTML = '<div class="sidebar-empty">Učitavam...</div>';
  try {
    const res = await fetch('/.netlify/functions/list-results');
    allClients = await res.json();
    renderSidebar();
  } catch(e) {
    document.getElementById('clientList').innerHTML = '<div class="sidebar-empty">Greška pri učitavanju.</div>';
  }
}

function renderSidebar() {
  const el = document.getElementById('clientList');
  if (!allClients.length) {
    el.innerHTML = '<div class="sidebar-empty">Još nema klijenata. Rezultati će se pojaviti čim klijent završi test.</div>';
    return;
  }
  el.innerHTML = allClients.map(c => `
    <div class="client-item ${c.key === activeKey ? 'active' : ''}" onclick="selectClient('${c.key}')">
      <div class="ci-name">${c.name}</div>
      <div class="ci-meta">
        <span>${formatDate(c.lastUpdated)}</span>
        ${c.types.includes('psihološki') ? '<span class="ci-badge psih">psiho</span>' : ''}
        ${c.types.includes('karijerni') ? '<span class="ci-badge kar">karijera</span>' : ''}
        <span>${c.entryCount} test${c.entryCount === 1 ? '' : 'ova'}</span>
      </div>
    </div>`).join('');
}

// ── SELECT CLIENT ─────────────────────────────────────

async function selectClient(key) {
  activeKey = key;
  renderSidebar();
  document.getElementById('mainPanel').innerHTML = '<div class="loading">Učitavam podatke...</div>';

  try {
    const res = await fetch(`/.netlify/functions/list-results?client=${key}`);
    const data = await res.json();
    if (!data) throw new Error('Nema podataka');
    renderClient(data);
  } catch(e) {
    document.getElementById('mainPanel').innerHTML = `<div class="loading">Greška: ${e.message}</div>`;
  }
}

// ── RENDER CLIENT ─────────────────────────────────────

function renderClient(data) {
  const entries = (data.entries || []).slice().reverse(); // newest first
  let html = `
    <div class="client-header">
      <h2>${data.name}</h2>
      <div class="client-header-meta">${entries.length} test${entries.length === 1 ? '' : 'ova'} · Zadnji: ${formatDate(data.lastUpdated)}</div>
    </div>`;

  entries.forEach((entry, i) => {
    html += renderEntry(entry, i);
  });

  document.getElementById('mainPanel').innerHTML = html;
}

function renderEntry(entry, idx) {
  const isPsih = entry.type === 'psihološki';
  const date = formatDate(entry.savedAt || entry.date);

  let html = `<div class="entry">
    <div class="entry-header">
      <div class="entry-type">
        <span class="entry-badge ${isPsih ? 'psih' : 'kar'}">${isPsih ? 'Psihološki test' : 'Karijerni profil'}</span>
        <span class="entry-date">${date}</span>
      </div>
      ${entry.priority ? `<span class="entry-priority priority-${entry.priority.toLowerCase()}">Prioritet: ${entry.priority}</span>` : ''}
    </div>`;

  if (isPsih) {
    html += renderPsihEntry(entry);
  } else {
    html += renderKarijerniEntry(entry);
  }

  html += '</div>';
  return html;
}

// ── PSIHOLOŠKI ────────────────────────────────────────

function renderPsihEntry(entry) {
  const scores = entry.scores || {};
  let html = '';

  // Big Five
  if (scores.b5 && Object.keys(scores.b5).length) {
    html += `<div class="section-label">Big Five · Ličnost</div>`;
    Object.keys(scores.b5).forEach(k => {
      html += `<div class="dim-row">
        <span class="dim-label">${DIM_NAMES[k]}</span>
        <div class="dim-track"><div class="dim-fill" style="width:${scores.b5[k]}%;background:${DIM_COLORS[k]}"></div></div>
        <span class="dim-val">${scores.b5[k]}</span>
      </div>`;
    });
    html += '<hr class="divider">';
  }

  // Attachment
  if (scores.attach && Object.keys(scores.attach).length) {
    const dom = Object.keys(scores.attach).sort((a,b) => scores.attach[b] - scores.attach[a])[0];
    html += `<div class="section-label">Stilovi privrženosti</div>
      <div class="score-grid">`;
    Object.keys(scores.attach).forEach(k => {
      html += `<div class="score-box">
        <div class="score-box-name">${ATTACH_NAMES[k]}${k === dom ? ' ★' : ''}</div>
        <div class="score-box-val">${scores.attach[k]}</div>
      </div>`;
    });
    html += '</div><hr class="divider">';
  }

  // Clinical scores
  const clin = [];
  if (scores.phq9 !== undefined) clin.push({ name: 'PHQ-9 · Depresija', val: scores.phq9, max: 27, ...phqLevel(scores.phq9) });
  if (scores.gad7 !== undefined) clin.push({ name: 'GAD-7 · Anksioznost', val: scores.gad7, max: 21, ...gadLevel(scores.gad7) });
  if (scores.rosenberg !== undefined) clin.push({ name: 'Rosenberg · Samopoštovanje', val: scores.rosenberg, max: 40, ...rosLevel(scores.rosenberg) });
  if (scores.pcl5 !== undefined) clin.push({ name: 'PCL-5 · Trauma', val: scores.pcl5, max: 80, ...pclLevel(scores.pcl5) });
  if (scores.npi16 !== undefined) clin.push({ name: 'NPI-16 · Narcisoidnost', val: scores.npi16, max: 16, ...npiLevel(scores.npi16) });

  if (clin.length) {
    html += `<div class="section-label">Klinički rezultati</div><div class="score-grid">`;
    clin.forEach(r => {
      html += `<div class="score-box">
        <div class="score-box-name">${r.name}</div>
        <div class="score-box-val ${r.cls === 'high' ? 'level-high' : 'level-ok'}">${r.val}<span style="font-size:11px;font-weight:400;color:var(--ink-muted)">/${r.max}</span></div>
        <div class="score-box-level ${r.cls === 'high' ? 'level-high' : 'level-ok'}">${r.level}</div>
      </div>`;
    });
    html += '</div><hr class="divider">';
  }

  // Red flags
  if (entry.redFlags?.some(f => f)) {
    html += `<div class="red-flags-box">
      <div class="red-flag-title">Crvene zastavice</div>
      ${entry.redFlags.filter(f => f).map(f => `<div class="red-flag-item">${f}</div>`).join('')}
    </div>`;
  }

  // Therapist note
  if (entry.therapistNote) {
    html += `<div class="section-label" style="margin-top:0.75rem">Klinička napomena</div>
      <div class="text-block">${entry.therapistNote}</div>`;
  }

  // Interpretation (collapsible)
  if (entry.interpretation) {
    const id = 'interp-' + Math.random().toString(36).slice(2);
    html += `<button class="collapse-btn" onclick="toggle('${id}')">▾ Interpretacija za klijenta</button>
      <div class="collapsible" id="${id}">
        <div class="text-block" style="margin-top:0.5rem">${entry.interpretation}</div>
      </div>`;
  }

  return html;
}

// ── KARIJERNI ─────────────────────────────────────────

function renderKarijerniEntry(entry) {
  let html = '';

  // RIASEC
  if (entry.riasec) {
    html += `<div class="section-label">Holland RIASEC</div>`;
    entry.riasec.split(', ').forEach(item => {
      const [name, pct] = item.split(': ');
      const val = parseInt(pct) || 0;
      html += `<div class="riasec-row">
        <div class="riasec-name">${name?.split('(')[0].trim()}</div>
        <div class="riasec-track"><div class="riasec-fill" style="width:${val}%"></div></div>
        <div class="riasec-val">${val}%</div>
      </div>`;
    });
    html += '<hr class="divider">';
  }

  // Values
  if (entry.values) {
    html += `<div class="section-label">Top vrijednosti</div>
      <div class="text-block" style="font-size:0.82rem">${entry.values.split('; ').map(v => `• ${v}`).join('<br>')}</div>
      <hr class="divider">`;
  }

  // Anxiety
  if (entry.anxiety) {
    html += `<div class="section-label">Socijalna nelagoda</div>`;
    entry.anxiety.split('; ').forEach(item => {
      const parts = item.split(': ');
      const name = parts[0];
      const val = parseInt(parts[1]) || 0;
      html += `<div class="riasec-row">
        <div class="riasec-name" style="width:160px;font-size:11px">${name.split('/')[0].trim()}</div>
        <div class="riasec-track"><div class="riasec-fill" style="width:${val}%;background:linear-gradient(90deg,#c94c4c,#e07070)"></div></div>
        <div class="riasec-val">${val}%</div>
      </div>`;
    });
    html += '<hr class="divider">';
  }

  // SWOT
  if (entry.swot) {
    const s = entry.swot;
    html += `<div class="section-label">SWOT analiza</div>
      <div class="swot-grid">
        <div class="swot-box"><div class="swot-lbl s">Snage</div><div class="swot-text">${s.s || '—'}</div></div>
        <div class="swot-box"><div class="swot-lbl w">Slabosti</div><div class="swot-text">${s.w || '—'}</div></div>
        <div class="swot-box"><div class="swot-lbl o">Prilike</div><div class="swot-text">${s.o || '—'}</div></div>
        <div class="swot-box"><div class="swot-lbl t">Prijetnje</div><div class="swot-text">${s.t || '—'}</div></div>
      </div>`;
    if (entry.interpretation) html += '<hr class="divider">';
  }

  // Interpretation
  if (entry.interpretation) {
    const id = 'interp-' + Math.random().toString(36).slice(2);
    html += `<div class="section-label">AI interpretacija</div>
      <div class="text-block">${entry.interpretation.substring(0, 300)}...</div>
      <button class="collapse-btn" onclick="toggle('${id}')">▾ Prikaži cijelu interpretaciju</button>
      <div class="collapsible" id="${id}">
        <div class="text-block" style="margin-top:0.5rem">${entry.interpretation}</div>
      </div>`;
  }

  return html;
}

// ── HELPERS ───────────────────────────────────────────

function toggle(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
  const btn = el.previousElementSibling;
  btn.textContent = el.classList.contains('open') ? '▴ Sakrij' : '▾ Prikaži cijelu interpretaciju';
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('hr-HR', { day: 'numeric', month: 'long', year: 'numeric' });
}

function phqLevel(s) {
  if (s >= 20) return { level: 'Teška depresija', cls: 'high' };
  if (s >= 15) return { level: 'Umjereno teška', cls: 'high' };
  if (s >= 10) return { level: 'Umjerena', cls: 'high' };
  if (s >= 5) return { level: 'Blaga', cls: 'ok' };
  return { level: 'Minimalna', cls: 'ok' };
}
function gadLevel(s) {
  if (s >= 15) return { level: 'Teška anksioznost', cls: 'high' };
  if (s >= 10) return { level: 'Umjerena', cls: 'high' };
  if (s >= 5) return { level: 'Blaga', cls: 'ok' };
  return { level: 'Minimalna', cls: 'ok' };
}
function rosLevel(s) {
  if (s >= 35) return { level: 'Visoko samopoštovanje', cls: 'ok' };
  if (s >= 23) return { level: 'Prosječno', cls: 'ok' };
  return { level: 'Nisko samopoštovanje', cls: 'high' };
}
function pclLevel(s) {
  return s >= 33 ? { level: 'Klinički značajno', cls: 'high' } : { level: 'Ispod praga', cls: 'ok' };
}
function npiLevel(s) {
  if (s >= 14) return { level: 'Visoko', cls: 'high' };
  if (s >= 10) return { level: 'Umjereno visoko', cls: 'high' };
  if (s >= 5) return { level: 'Prosječno', cls: 'ok' };
  return { level: 'Nisko', cls: 'ok' };
}
